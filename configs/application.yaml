app:
  name: ai-agent-scaffold-go
  env: local
server:
  addr: ":8091"
database:
  required: false
  dsn: "root:123456@tcp(127.0.0.1:13306)/ai-agent-scaffold-go?charset=utf8mb4&parseTime=True&loc=Local"
redis:
  required: false
  addr: "127.0.0.1:16379"
  password: ""
  db: 0
llm:
  # HTTP 客户端超时；实际调用还受 runtime.model-timeout 和总请求期限约束
  request-timeout: 60s
agent:
  config-paths:
    - configs/agent/only-one-agent.yaml
    - configs/agent/agent-draw-io.yaml
# Runtime limits apply to an entire drawing execution, including repairs.
runtime:
  request-timeout: 180s
  model-timeout: 60s
  tool-timeout: 20s
  max-model-calls: 8
  max-request-bytes: 2097152
  max-model-bytes: 1048576
  max-tool-bytes: 262144
